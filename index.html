<title>Surtido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para el restaurante (máx 560px), panel ancho para el proveedor (máx 980px); barra de pedido fija abajo. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#17221C; --muted:#5D6B62; --line:#DCE2DB;
  --accent:#1C6E47; --accent-ink:#FFFFFF; --accent-soft:#E2EFE6;
  --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#A33A2C; --bad-soft:#F8E3DF; --info:#2F5D8A; --info-soft:#E1EBF5;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#17201B; --ink:#E6EDE8; --muted:#97A69D; --line:#28352E;
  --accent:#55C189; --accent-ink:#0B130F; --accent-soft:#1D3328;
  --warn:#E7AE4F; --warn-soft:#33281A; --bad:#EE8B7C; --bad-soft:#3A221E; --info:#8AB6E3; --info-soft:#1C2A38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#17201B; --ink:#E6EDE8; --muted:#97A69D; --line:#28352E;
  --accent:#55C189; --accent-ink:#0B130F; --accent-soft:#1D3328;
  --warn:#E7AE4F; --warn-soft:#33281A; --bad:#EE8B7C; --bad-soft:#3A221E; --info:#8AB6E3; --info-soft:#1C2A38; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 128px;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:560px;margin:0 auto}
.wrap.wide{max-width:980px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:980px;margin:0 auto}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.pill{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.who b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 2px}

.tabs{display:flex;gap:4px;margin:16px 0 4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

.delivery{margin:16px 0;display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.delivery b{display:block;font-size:15px}
.delivery span{font-size:13px;color:var(--muted)}
.delivery .day{font-family:var(--display);font-weight:800;font-size:28px;color:var(--accent);line-height:1;min-width:44px;text-align:center}
.delivery .day small{display:block;font-family:var(--body);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 8px;flex-wrap:wrap}
.sec-h h2{font-size:20px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
.sub{color:var(--muted);font-size:13px;margin:0 0 8px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .name{font-weight:600;min-width:0}
.item .why{grid-column:1;font-size:12.5px;color:var(--muted);min-width:0}
.item .price{grid-column:2;text-align:right;font-size:12.5px;color:var(--muted)}
.item.off .name{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:2px;grid-row:1;grid-column:2}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:600;line-height:1}
.stepper output{min-width:66px;text-align:center;font-weight:700;font-size:14px}
.add{grid-row:1;grid-column:2;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:10px;padding:8px 14px;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;vertical-align:1px;white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.mute{background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

details.more{margin-top:10px}
details.more summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;padding:8px 0}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:4px 0 8px;font-size:16px}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

.how{margin-top:14px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.how summary{cursor:pointer;font-weight:600}
.how ul{margin:8px 0 0;padding-left:18px}
.how li{margin:3px 0}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-in .sum{flex:1;min-width:0}
.bar-in .sum b{display:block;font-size:17px}
.bar-in .sum span{font-size:12.5px;color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px}
.primary:disabled{opacity:.45;cursor:default}
.primary.full{width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.done-h{display:flex;gap:12px;align-items:center;margin:20px 0 12px}
.check{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.steps{display:flex;margin:14px 0 4px;gap:4px}
.steps div{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.steps div::before{content:"";display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:6px}
.steps div.on{color:var(--ink)}
.steps div.on::before{background:var(--accent)}
.wa{white-space:pre-wrap;font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px;margin:10px 0;border:1px solid var(--line);overflow-wrap:anywhere}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.order{margin-bottom:10px}
.order-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.order-h h3{font-size:17px}
.order-h .meta{font-size:12.5px;color:var(--muted)}
.order ul{list-style:none;margin:10px 0;padding:0;border-top:1px solid var(--line)}
.order li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.order li .q{font-weight:600;white-space:nowrap}
.order li.changed .q{color:var(--warn)}
.order li input{width:72px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right;font-size:16px}
.order li .unit{font-size:12px;color:var(--muted);margin-left:4px}
.new{outline:2px solid var(--accent);outline-offset:-1px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-family:var(--display);font-size:24px;display:block}
.stat span{font-size:12.5px;color:var(--muted)}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.buy{font-weight:700;color:var(--accent)}
td.l,th.l{text-align:left}
td input,td select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
td input[type="number"]{width:96px;text-align:right}
tr.inactive td{color:var(--muted)}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.barcell i{display:block;height:8px;border-radius:4px;background:var(--accent);opacity:.75}

.quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;margin:12px 0;font-size:13px}
.quad .ax{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;justify-content:center}
.quad .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.quad .cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:86px;min-width:0}
.quad .cell b{display:block;font-size:14px}
.quad .cell small{color:var(--muted);display:block;margin-bottom:6px}
.quad .cell.key{border-color:var(--accent);background:var(--accent-soft)}

.form{display:grid;gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.field textarea{min-height:110px;font-size:14px;font-family:ui-monospace,Menlo,monospace}
.field .hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{width:46px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted)}
.daychips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.login{max-width:420px;margin:40px auto 0}
.login h1{font-size:30px;margin-bottom:6px}
.code-in{letter-spacing:.4em;font-size:22px !important;text-align:center;font-weight:700}
.demo{margin-top:22px}
.demo h3{font-size:13px;font-family:var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.demo button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.demo button span{color:var(--muted);font-size:13px;white-space:nowrap}
.invite-hero{background:var(--accent-soft);border-radius:14px;padding:16px;margin:24px 0 16px}
.invite-hero h1{font-size:24px;margin-bottom:4px}

.inv{padding:12px 14px;border-top:1px solid var(--line)}
.inv:first-child{border-top:0}
.inv-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.inv-h > div:first-child{min-width:0}
.inv-h .why{font-size:12.5px;color:var(--muted)}
.inv-q{display:grid;gap:3px;justify-items:end;text-align:right}
.inv-q b{font-size:16px;white-space:nowrap}
.cov{position:relative;height:8px;border-radius:4px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);margin:10px 0 6px}
.cov i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.cov i.bad{background:var(--bad)} .cov i.warn{background:var(--warn)} .cov i.info{background:var(--info)}
.cov s{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.inv-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.fix{margin-top:10px;display:grid;gap:6px;font-size:13px;font-weight:600}
.fix input{width:96px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:right;font-size:16px}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bad-soft);border-radius:12px;padding:10px 14px;margin:-4px 0 12px;font-size:14px}
.alert b{color:var(--bad)}
.checkin{border-color:var(--accent);margin-bottom:12px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.strip div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;min-width:0;color:var(--muted)}
.strip div b{display:block;font-size:13px;color:var(--ink)}
.strip .alto{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.strip .normal{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.strip .suave{background:var(--info-soft);border-color:transparent;color:var(--info)}
.strip .cerrado{opacity:.45}
.ing{list-style:none;margin:10px 0;padding:0;border-top:1px solid var(--line)}
.ing li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.ing li span{min-width:0}
.ing-add{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ing-add select,.ing-add input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;min-width:0}
.ing-add select{flex:1 1 180px}
.ing-add input{width:110px}
.dish{margin-bottom:10px}
td select{max-width:150px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}
.feed{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin-bottom:4px}
.fc{flex:0 0 min(82%,300px);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fc p{margin:0;font-size:14px}
.fc .row-btns{margin-top:auto}
.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.sups{display:grid;gap:10px}
.supc{display:grid;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%}
.supc-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.supc-h b{font-size:16px;min-width:0}
.supc .meta{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.back{background:none;border:0;color:var(--accent);font-weight:700;padding:14px 0 0;font-size:14px}
.sup-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.sup-title h2{font-size:22px}
.deals{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px}
.deal{flex:0 0 min(72%,240px);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.deal-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pct{background:var(--bad);color:var(--surface);font-weight:800;border-radius:8px;padding:2px 8px;font-size:14px}
.dprice b{font-size:17px}
.dprice s{color:var(--muted);font-size:13px;margin-left:4px}
.deal .sub{margin:0}
.deal .add{align-self:flex-start}
.meter{height:8px;border-radius:4px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--accent)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:800;letter-spacing:.08em}
.dealrow{display:grid;gap:4px}
</style>

<header class="top">
  <div class="top-row">
    <div class="brand">Surtido<i>.</i></div>
    <span class="pill">Prototipo</span>
    <div class="who" id="who"></div>
  </div>
</header>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------- utilidades ---------- */
const DAY = 864e5;
const T0 = (() => { const d = new Date(); d.setHours(12,0,0,0); return d.getTime(); })();
const dateOf = d => new Date(T0 + d * DAY);
const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
const DOWL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MON = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fDate = d => { const x = dateOf(d); return `${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`; };
const fDow = d => DOW[dateOf(d).getDay()];
const wd = d => dateOf(d).getDay();
const relDay = d => d === 0 ? 'hoy' : d === 1 ? 'mañana' : d === 2 ? 'pasado mañana' : `el ${fDate(d)}`;
const money = n => '$' + Math.round(n).toLocaleString('es-CO');
const median = a => { if (!a.length) return 0; const s = [...a].sort((x,y)=>x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1]+s[m]) / 2; };
const STEP = { kg: 0.5, und: 1, atado: 1 };
const roundStep = (q,u) => Math.max(STEP[u], Math.round(q / STEP[u]) * STEP[u]);
const fQty = (q,u) => u === 'kg' ? `${q.toLocaleString('es-CO',{maximumFractionDigits:1})} kg` : u === 'und' ? `${q} und` : `${q} ${q === 1 ? 'atado' : 'atados'}`;
const fApprox = (q,u) => fQty(u === 'kg' ? Math.round(q * 2) / 2 : Math.round(q), u);
const fRate = (r,u) => `${r.toLocaleString('es-CO',{maximumFractionDigits:1})} ${u === 'atado' ? 'atados' : u}/día`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const digits = s => String(s || '').replace(/\D/g, '');
const fPhone = p => { const d = digits(p); return d.length === 10 ? `${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}` : d; };

const delivered = (bid, sid) => ORDERS.filter(o => o.b === bid && o.status === 'Entregado' && (!sid || o.s === sid)).sort((a,b) => a.day - b.day);
function cadence(bid, sid){ const ds = delivered(bid, sid).map(o => o.day); const diffs = ds.slice(1).map((d,i) => d - ds[i]); return diffs.length ? median(diffs) : 7; }
function pstats(bid, pid){
  const rows = []; for (const o of delivered(bid)) for (const it of o.items) if (it.p === pid) rows.push({day:o.day, q:it.del});
  if (!rows.length) return null;
  const n = rows.length, last = rows[n-1];
  const ints = rows.slice(1).map((r,i) => r.day - rows[i].day);
  const intTyp = Math.max(1, ints.length ? median(ints.slice(-6)) : 3);
  const qtyTyp = median(rows.slice(-6).map(r => r.q));
  return { n, last:last.day, lastQ:last.q, daysSince:-last.day, intTyp, qtyTyp, rate: qtyTyp / intTyp, next: last.day + intTyp };
}
function boughtSet(bid, sid){ const s = new Set(); delivered(bid).forEach(o => o.items.forEach(it => { const p = PR[it.p]; if (p && p.active && (!sid || p.s === sid)) s.add(it.p); })); return s; }

const LEVELS = {suave:{f:0.7, l:'Suave', c:'mute'}, normal:{f:1, l:'Normal', c:'ok'}, alto:{f:1.4, l:'Alto', c:'warn'}, cerrado:{f:0, l:'Cerrado', c:'bad'}};
const NOTIF_DELAY = 30, NOTIF_REMIND = 60;
const BIZ = {};
const biz = bid => BIZ[bid] ||= {open:[0,1,2,3,4,5,6], close:'22:00', log:{}, menu:[]};
function wdFactor(bid, w){
  const b = biz(bid); if (!b.open.includes(w)) return 0;
  const v = Object.entries(b.log).filter(([d,l]) => +d <= 0 && l !== 'cerrado' && wd(+d) === w).map(([,l]) => LEVELS[l].f);
  return v.length ? v.reduce((t,x) => t + x, 0) / v.length : 1;
}
function mult(bid, d){ const b = biz(bid), l = b.log[d]; if (l) return LEVELS[l].f; return b.open.includes(wd(d)) ? wdFactor(bid, wd(d)) : 0; }
function consume(bid, rate, a, b){ let t = 0; for (let k = Math.floor(a); k < b; k++) { const lo = Math.max(a,k), hi = Math.min(b,k+1); if (hi > lo) t += (hi - lo) * mult(bid,k); } return rate * t; }
function runout(bid, rate, stock, from){ let t = from, left = stock; for (let i = 0; i < 90; i++) { const k = Math.floor(t), r = rate * mult(bid,k), c = r * (k + 1 - t); if (r > 0 && c >= left) return t + left / r; left -= c; t = k + 1; } return t; }
const nowT = bid => biz(bid).log[0] ? 1 : 0.5;
function theo(bid, pid, useBase){ return biz(bid).menu.reduce((t,d) => t + (useBase ? d.base : d.perDay) * d.ing.filter(i => i.p === pid).reduce((s,i) => s + i.q, 0), 0); }
function menuProducts(bid, sid){ const s = new Set(); biz(bid).menu.forEach(d => d.ing.forEach(i => { const p = PR[i.p]; if (p && p.active && (!sid || p.s === sid)) s.add(i.p); })); return s; }
function checkinDay(bid){
  const b = biz(bid), sent = minsNow() >= toMin(b.close) + NOTIF_DELAY;
  for (const d of [0,-1,-2]) { if (d === 0 && !sent) continue; if (b.open.includes(wd(d)) && b.log[d] !== 'cerrado') return b.log[d] ? null : d; }
  return null;
}

/* ---------- inventario predictivo ---------- */
const CORR = {};
function deliveriesOf(bid,pid){ const r = []; for (const o of delivered(bid)) for (const it of o.items) if (it.p === pid) r.push({day:o.day, q:it.del}); return r; }
function invModel(bid, pid){
  const all = deliveriesOf(bid,pid), th = theo(bid,pid), thBase = theo(bid,pid,true);
  if (!all.length || (all.length < 2 && !th)) return null;
  const w = all.slice(-7), p = PR[pid], s = pstats(bid,pid), now = nowT(bid);
  let hist = 0;
  if (w.length >= 2) { const used = w.slice(0,-1).reduce((t,r) => t + r.q, 0), days = consume(bid, 1, w[0].day, w[w.length-1].day); hist = days > 0 ? used / days : s.rate; }
  const wt = Math.min(1, (w.length - 1) / 5);
  const base = w.length >= 2 ? (th ? wt * hist + (1 - wt) * th : hist) : th;
  const rate0 = Math.max(1e-6, base + (th - thBase));
  const c = CORR[bid + '|' + pid] || {f:1}, rate = rate0 * c.f;
  let stock = 0, prev = w[0].day;
  for (const r of w) { stock = Math.max(0, stock - consume(bid, rate, prev, r.day)) + r.q; prev = r.day; }
  const last = w[w.length-1], anchored = c.anchor && c.anchor.day >= last.day;
  const current = anchored ? Math.max(0, c.anchor.q - consume(bid, rate, c.anchor.t, now)) : Math.max(0, stock - consume(bid, rate, last.day, now));
  const incoming = ORDERS.filter(o => o.b === bid && o.status !== 'Entregado').flatMap(o => o.items.filter(it => it.p === pid).map(it => ({day:o.deliver, q:it.del})));
  const ints = w.slice(1).map((r,i) => r.day - w[i].day), qs = w.map(r => r.q);
  const cv = a => { const m = a.reduce((t,x) => t + x, 0) / a.length; return m ? Math.sqrt(a.reduce((t,x) => t + (x - m) ** 2, 0) / a.length) / m : 1; };
  const noise = w.length >= 2 ? (cv(ints) + cv(qs)) / 2 : 1;
  const conf = all.length >= 6 && noise < 0.25 ? 'alta' : all.length >= 3 && noise < 0.5 ? 'media' : 'baja';
  return {pid, p, rate, rate0, current, out: current > 0 ? runout(bid, rate, current, now) : now, now, last, stockAtLast: stock, incoming, conf,
    intTyp: s && s.n >= 2 ? s.intTyp : 3, share: th ? Math.min(1, th / rate) : 0, menuDelta: th - thBase, onlyMenu: w.length < 2, corrected: c.f !== 1 || anchored};
}
const URG = {bad:0, warn:1, info:2, ok:3};
function inventory(bid, sid){
  const pids = new Set([...boughtSet(bid, sid), ...menuProducts(bid, sid)]);
  return [...pids].map(pid => invModel(bid,pid)).filter(Boolean).map(m => {
    const ps = m.p.s, D = nextDelivery(ps), cad = delivered(bid, ps).length >= 2 ? cadence(bid, ps) : 3;
    const inc = m.incoming.length ? Math.min(...m.incoming.map(x => x.day)) : null, out = m.out, u = m.p.u, H = Math.max(cad, m.intTyp);
    m.D = D;
    if (m.current < STEP[u] / 2 && inc == null) Object.assign(m, {cls:'bad', label:'Agotado'});
    else if (inc != null) Object.assign(m, out < inc ? {cls:'bad', label:'Se acaba antes de que llegue'} : {cls:'info', label:`Llega ${relDay(inc)}`});
    else if (out < D) Object.assign(m, {cls:'bad', label:'No alcanza a la entrega'});
    else if (out < D + cad) Object.assign(m, {cls:'warn', label:'Pídelo en este pedido'});
    else Object.assign(m, {cls:'ok', label:'Alcanza'});
    m.until = m.current < STEP[u] / 2 ? 'Sin existencias' : out < 1 ? 'Se acaba hoy' : `Alcanza hasta el ${fDate(Math.floor(out))}`;
    const atD = Math.max(0, m.current - consume(bid, m.rate, m.now, D));
    m.need = roundStep(Math.max(STEP[u], consume(bid, m.rate, D, D + H) - atD), u);
    return m;
  }).sort((a,b) => URG[a.cls] - URG[b.cls] || a.out - b.out);
}
function suggestions(bid, sid){
  const inv = inventory(bid, sid), due = [], later = [], known = new Set(inv.map(m => m.pid)), D = nextDelivery(sid);
  for (const m of inv) { const s = pstats(bid, m.pid); if ((m.cls === 'bad' || m.cls === 'warn') && !m.incoming.length) due.push({pid:m.pid, q:m.need, m, s}); else later.push({pid:m.pid, m, s}); }
  for (const pid of boughtSet(bid, sid)) if (!known.has(pid)) { const s = pstats(bid,pid); if (s.daysSince + D >= 0.8 * cadence(bid, sid)) due.push({pid, q:s.lastQ, s}); else later.push({pid, s}); }
  const bought = boughtSet(bid, sid);
  for (const pid of menuProducts(bid, sid)) if (!known.has(pid) && !bought.has(pid)) due.push({pid, q: roundStep(consume(bid, theo(bid,pid), D, D + 3), PR[pid].u), menuOnly:true});
  return {due, later};
}
function clientsOf(sid){ return BUYERS.filter(b => b.sups.includes(sid)); }
function buyerStats(sid){
  const rows = clientsOf(sid).map(b => {
    const os = delivered(b.id, sid), last30 = os.filter(o => o.day >= -30);
    const sales = last30.reduce((t,o) => t + o.items.reduce((s,it) => s + it.del * it.price, 0), 0);
    const perWeek = last30.length / (30/7), daysSince = os.length ? -os[os.length-1].day : null, cad = cadence(b.id, sid);
    return { b, sales, orders:last30.length, perWeek, ticket: last30.length ? sales / last30.length : 0, daysSince, cad, isNew: os.length < 2, risk: os.length >= 2 && daysSince > 1.5 * cad };
  }).sort((a,b) => b.sales - a.sales);
  const total = rows.reduce((t,r) => t + r.sales, 0) || 1; let cum = 0;
  for (const r of rows) { r.big = cum / total < 0.8 && r.sales > 0; cum += r.sales; r.share = r.sales / total; r.freq = r.perWeek >= 2;
    r.seg = r.isNew ? 'Nuevo' : r.big && r.freq ? 'Clave' : r.big ? 'Por desarrollar' : r.freq ? 'Fiel' : 'Ocasional'; }
  return rows;
}

function clientToday(sid, bid){
  const pend = ORDERS.find(o => o.s === sid && o.b === bid && o.status !== 'Entregado');
  if (pend) return {cls:'ok', label:`Pidió para el ${fDate(pend.deliver)}`, k:'ok'};
  const os = delivered(bid, sid); if (!os.length) return {cls:'mute', label:'Sin pedidos todavía', k:'new'};

}
function growth(sid, bid){
  const tot = (a, b) => { const r = {}; delivered(bid, sid).filter(o => o.day >= a && o.day < b).forEach(o => o.items.forEach(it => r[it.p] = (r[it.p] || 0) + it.del)); return r; };

function cartUntouched(sid){ const c = cart(sid), a = Object.entries(c.items).filter(([,q]) => q > 0), k = Object.keys(c.sugQ); return a.length === k.length && a.every(([p,q]) => c.sugQ[p] === q); }

}
function buyerFeed(bid){
  const f = [], b = BY[bid], cd = checkinDay(bid);
  if (cd != null) f.push({k:'Cierre del servicio', cls:'info', t:`¿Cómo estuvo el movimiento ${whenTxt(cd)}?`, btns: ['suave','normal','alto'].map(l => `<button class="ghost sm" data-act="lvl" data-v="${l}" data-d="${cd}">${LEVELS[l].l}</button>`).join('')});
  const inv = inventory(bid);
  for (const sid of b.sups) { const bad = inv.filter(m => m.p.s === sid && m.cls === 'bad');
    if (bad.length) f.push({k:'Inventario', cls:'bad', t:`${esc(bad.slice(0,2).map(m => m.p.n).join(' y '))}${bad.length > 2 ? ` y ${bad.length - 2} más` : ''} no ${bad.length === 1 ? 'alcanza' : 'alcanzan'} a la entrega del ${fDate(nextDelivery(sid))} de ${esc(sup(sid).name)}.`, act:'go-sup', v:sid, b:'Pedir'}); }
  for (const sid of b.sups) { const mine = boughtSet(bid, sid);
    activeDeals(sid).sort((x,y) => mine.has(y.p) - mine.has(x.p)).slice(0,2).forEach(d => f.push({k:'Oferta', cls:'ok', t:`${esc(PR[d.p].n)} −${d.pct}% en ${esc(sup(sid).name)}: ${REASONS[d.r].l.toLowerCase()}. Quedan ${fQty(dealLeft(d), PR[d.p].u)}.`, act:'go-sup', v:sid, b:'Ver oferta'})); }
  for (const sid of b.sups) { const sp = sup(sid); if (!sp.inApp || cutoffPassed(sid) || ORDERS.some(o => o.b === bid && o.s === sid && o.status !== 'Entregado')) continue;
    const n = suggestions(bid, sid).due.length; if (n) f.push({k:'Cierre de pedidos', cls:'warn', t:`${esc(sp.name)} recibe pedidos hasta las ${fCut(sid)}. Tienes ${n} productos por pedir.`, act:'go-sup', v:sid, b:'Hacer pedido'}); }
  const seen = new Set();
  for (const o of delivered(bid).filter(o => o.day >= -30).reverse()) for (const it of o.items) { if (seen.has(it.p) || it.deal) continue; seen.add(it.p);
    const p = PR[it.p], ch = p.pr / it.price - 1; if (Math.abs(ch) >= 0.05) f.push({k:'Precio', cls: ch > 0 ? 'warn' : 'ok', t:`${esc(p.n)} ${ch > 0 ? 'subió' : 'bajó'} ${Math.round(Math.abs(ch) * 100)}% en ${esc(sup(p.s).name)}: ahora ${money(p.pr)}/${p.u}.`, act:'go-sup', v:p.s, b:'Ver proveedor'}); }
  for (const sid of b.sups) { const sp = sup(sid); if (!sp.inApp) f.push({k:'Invita y gana', cls:'info', t:`${esc(sp.name)} todavía recibe tus pedidos por WhatsApp. Invítalo a la app y cada uno gana ${REF_PCT}% en la mensualidad.`, act:'ref-sup', v:sid, b:'Invitar'}); }
  return f;
}
function supFeed(sid){
  const f = [], pend = pendingOrders(sid).filter(o => o.status === 'Recibido');
  if (pend.length) f.push({k:'Pedidos', cls:'warn', t:`Tienes ${pend.length} ${pend.length === 1 ? 'pedido' : 'pedidos'} por confirmar.`, act:'go-stab', v:'pedidos', b:'Ver pedidos'});
  for (const b of clientsOf(sid)) { const st = clientToday(sid, b.id);
    if (st.k === 'due') f.push({k:'Cliente', cls:'warn', t:`${esc(b.name)} suele pedir hoy y todavía no lo hace. Cierras a las ${fCut(sid)}.`, act:'remind', v:b.id, b:'Copiar recordatorio'});
    if (st.k === 'risk') f.push({k:'En riesgo', cls:'bad', t:`${esc(b.name)} lleva ${st.label.split(' ')[0]} días sin pedir; normalmente pide cada ${cadence(b.id, sid)}.`, act:'call', v:b.id, b:'Ver teléfono'});
    const g = growth(sid, b.id)[0]; if (g) f.push({k:'Crece', cls:'ok', t:`${esc(b.name)} pide ${Math.round(g.ch * 100)}% más ${esc(PR[g.pid].n.toLowerCase())} que el mes anterior.`}); }
  const ds = activeDeals(sid);
  ds.forEach(d => f.push({k:'Oferta activa', cls:'ok', t:`${esc(PR[d.p].n)}: vendiste ${fQty(d.sold, PR[d.p].u)} de ${fQty(d.qty, PR[d.p].u)}. ${untilTxt(d.until)}.`, act:'go-stab', v:'ofertas', b:'Ver ofertas'}));
  if (!ds.length) f.push({k:'Ofertas', cls:'info', t:'¿Tienes producto por vencer o con detalle visual? Publícalo como oferta para tus clientes.', act:'go-stab', v:'ofertas', b:'Crear oferta'});
  const r = refCalc(ref('s:' + sid)); f.push({k:'Invita y gana', cls:'info', t: r.now ? `Este mes tienes ${r.now}% de descuento en tu mensualidad. Cada negocio que invites suma ${REF_PCT}%.` : `Invita a otro negocio y gana ${REF_PCT}% en tu mensualidad por cada uno que se una.`, act:'go-stab', v:'ref', b:'Invitar'});
  return f;
}

  return `<div class="card checkin"><div class="sub" style="margin:0 0 2px">${late ? 'Recordatorio' : 'Notificación'} · ${fDate(d)}${d === 0 ? ` · ${fHour(addMin(b.close, late ? NOTIF_REMIND : NOTIF_DELAY))}` : ''}</div><b>¿Cómo estuvo el movimiento ${whenTxt(d)}?</b>

}
function invRow(x){

    <li>Existencia hoy = lo que tenías + lo que llegó en cada entrega − lo consumido cada día según su movimiento.</li>
    <li>Cuando corriges una cantidad, la app compara lo que estimó con lo que tienes y ajusta tu consumo diario a la mitad del camino.</li>

function applyFix(pid, q){
  const bid = S.session.bid, m = invModel(bid, pid), key = bid + '|' + pid, c = CORR[key] || {f:1}, nd = consume(bid, 1, m.last.day, m.now);
  if (nd >= 0.5 && m.rate0 > 0) { const obs = Math.max(0, (m.stockAtLast - q) / nd); c.f = Math.min(2.5, Math.max(0.4, 0.5 * c.f + 0.5 * Math.min(2.5, Math.max(0.4, obs / m.rate0)))); }
  c.anchor = {day:0, t:m.now, q}; CORR[key] = c; S.fix = null;
  const n = invModel(bid, pid); toast(`Listo. Ahora calculamos que usas ≈ ${fRate(n.rate, n.p.u)} de ${n.p.n.toLowerCase()}.`);
}

function supPrev(){

const UNITS = {kg:'kg',kilo:'kg',kilos:'kg',kgs:'kg',libra:null,lb:null,und:'und',unidad:'und',unidades:'und',un:'und',u:'und',atado:'atado',atados:'atado',manojo:'atado'};
function parsePrice(v){ if (typeof v === 'number') return Math.round(v); const s = String(v || '').replace(/[^\d.,]/g, ''); if (!s) return NaN; return Math.round(Number(s.replace(/[.,](?=\d{3}(\D|$))/g, '').replace(',', '.'))); }
function rowsFromText(txt){ const lines = txt.split(/\r?\n/).filter(l => l.trim()); if (!lines.length) return []; const sep = lines[0].includes('\t') ? '\t' : lines[0].split(';').length > lines[0].split(',').length ? ';' : ','; return lines.map(l => l.split(sep).map(c => c.trim().replace(/^"|"$/g, ''))); }
function analyze(rows){

  let body = rows.slice(1);
  if (ci.n < 0 || ci.p < 0) { ci = {n:0, c:1, u:2, p:3}; body = rows; }
  const ok = [], bad = [], mine = productsOf(SID());
  body.forEach((r, i) => {
    const n = String(r[ci.n] ?? '').trim(), u0 = norm(r[ci.u] ?? ''), u = u0 ? UNITS[u0] : 'und', pr = parsePrice(r[ci.p]);
    const line = i + (body === rows ? 1 : 2);

function readImportFile(file){
  const name = file.name.toLowerCase();
  if (name.endsWith('.csv') || name.endsWith('.txt')) { file.text().then(t => { const res = analyze(rowsFromText(t)); S.imp = res.error ? {err:res.error} : {res}; render(); }); return; }
  if (typeof XLSX === 'undefined') { S.imp = {err:'No se pudo cargar el lector de Excel. Guarda el archivo como CSV o pega las filas.'}; render(); return; }
  file.arrayBuffer().then(buf => { try { const wb = XLSX.read(buf, {type:'array'}); const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, blankrows:false});
      const res = analyze(rows.map(r => r.map(c => c == null ? '' : c))); S.imp = res.error ? {err:res.error} : {res}; }
    catch(e) { S.imp = {err:'No pude leer ese archivo. Prueba guardándolo como .xlsx o .csv.'}; } render(); });
}

    if (typeof XLSX === 'undefined') { toast('No se pudo generar el archivo. Usa la plantilla vacía.'); return; }
    const aoa = [['Producto','Categoría','Unidad','Precio (COP)'], ['Ejemplo: Tomate chonto','Verduras','kg',3200], ...productsOf(SID()).filter(p => p.active).map(p => [p.n, p.c, p.u, p.pr])];
    const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [{wch:34},{wch:18},{wch:10},{wch:14}];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Catálogo');
    try { XLSX.writeFile(wb, 'catalogo-actual.xlsx'); toast('Descargando tu catálogo'); } catch(err) { toast('Tu navegador bloqueó la descarga.'); }
    return; }
  else if (a === 'imp-paste') { const t = $('imp-paste').value; if (!t.trim()) { S.imp = {err:'Pega al menos una fila.'}; } else { const res = analyze(rowsFromText(t)); S.imp = res.error ? {err:res.error} : {res}; } }
  else if (a === 'imp-apply') { const {ok} = S.imp.res; let nNew = 0, nUpd = 0;
    for (const r of ok) { if (r.ex) { const p = PR[r.ex]; if (p.pr !== r.pr) { p.pr = r.pr; nUpd++; } p.active = true; } else { PRODUCTS.push({id:'p' + Math.random().toString(36).slice(2,8), n:r.n, c:r.c, u:r.u, pr:r.pr, s:SID(), active:true}); nNew++; } }
    syncPR(); S.imp = null; toast(`Catálogo actualizado: ${nNew} nuevos, ${nUpd} precios cambiados`); }
  else return;
  render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'del') { const o = ORDERS.find(x => x.id === +t.dataset.o), it = o.items[+t.dataset.i];
    const v = parseFloat(String(t.value).replace(',', '.')); it.del = isNaN(v) || v < 0 ? it.qty : v; render(); }
  else if (t.dataset.act === 'price') { const v = parsePrice(t.value); if (v > 0) { PR[t.dataset.p].pr = v; toast(`Precio de ${PR[t.dataset.p].n}: ${money(v)}`); } else t.value = PR[t.dataset.p].pr; }
  else if (t.dataset.act === 'active') { PR[t.dataset.p].active = t.checked; render(); }
  else if (t.id === 'cutoff' && t.value) { sup(SID()).cutoff = t.value; render(); }
  else if (t.id === 'close-t' && t.value) { biz(S.session.bid).close = t.value; render(); }
  else if (t.dataset.act === 'plan') { const b = biz(S.session.bid), d = +t.dataset.d; if (t.value) b.log[d] = t.value; else delete b.log[d]; bizChanged(); toast(`${fDate(d)}: ${t.value ? LEVELS[t.value].l.toLowerCase() : 'automático'}. Ajustamos tu inventario y tus pedidos sugeridos.`); render(); }
  else if (t.dataset.act === 'perday') { const d = biz(S.session.bid).menu.find(x => x.id === t.dataset.v), v = parseInt(t.value, 10);
    if (!(v >= 0)) { t.value = d.perDay; return; } d.perDay = v; bizChanged();
    toast(v === d.base ? `${d.name}: vuelve a lo de siempre` : `${d.name}: ${v > d.base ? 'sube' : 'baja'} a ${v} al día. Ajustamos sus ingredientes.`); render(); }
  else if (t.id === 'imp-file' && t.files[0]) readImportFile(t.files[0]);
});
document.addEventListener('toggle', e => { if (e.target.id) S.det[e.target.id] = e.target.open; }, true);
document.addEventListener('input', e => { if (e.target.id === 'search') { S.q = e.target.value; $('catalog').innerHTML = catalogHtml(); } });
render();
</script>
