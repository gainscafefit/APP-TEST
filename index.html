<title>Surtido</title>

<style>
/* Layout: app de una columna para el restaurante (máx 560px), panel ancho para el proveedor (máx 980px); barra de pedido fija abajo. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#17221C; --muted:#5D6B62; --line:#DCE2DB;
  --accent:#1C6E47; --accent-ink:#FFFFFF; --accent-soft:#E2EFE6;
  --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#A33A2C; --bad-soft:#F8E3DF; --info:#2F5D8A; --info-soft:#E1EBF5;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#17201B; --ink:#E6EDE8; --muted:#97A69D; --line:#28352E;
  --accent:#55C189; --accent-ink:#0B130F; --accent-soft:#1D3328;
  --warn:#E7AE4F; --warn-soft:#33281A; --bad:#EE8B7C; --bad-soft:#3A221E; --info:#8AB6E3; --info-soft:#1C2A38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#17201B; --ink:#E6EDE8; --muted:#97A69D; --line:#28352E;
  --accent:#55C189; --accent-ink:#0B130F; --accent-soft:#1D3328;
  --warn:#E7AE4F; --warn-soft:#33281A; --bad:#EE8B7C; --bad-soft:#3A221E; --info:#8AB6E3; --info-soft:#1C2A38; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 128px;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:560px;margin:0 auto}
.wrap.wide{max-width:980px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:980px;margin:0 auto}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.pill{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctx{display:flex;align-items:center;gap:8px;max-width:980px;margin:8px auto 0;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ctx select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-weight:600;color:var(--ink)}

.tabs{display:flex;gap:4px;margin:16px 0 4px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

.delivery{margin:16px 0;display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.delivery b{display:block;font-size:15px}
.delivery span{font-size:13px;color:var(--muted)}
.delivery .day{font-family:var(--display);font-weight:800;font-size:28px;color:var(--accent);line-height:1;min-width:44px;text-align:center}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 8px}
.sec-h h2{font-size:20px}
.sec-h .act{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}

.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:600;line-height:1}

.add{grid-row:1;grid-column:2;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:10px;padding:8px 14px;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;vertical-align:1px}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.mute{background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

details.more{margin-top:10px}
details.more summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;padding:8px 0}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:4px 0 8px;font-size:16px}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

.how{margin-top:14px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.how summary{cursor:pointer;font-weight:600}
.how ul{margin:8px 0 0;padding-left:18px}
.how li{margin:3px 0}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-in .sum{flex:1;min-width:0}
.bar-in .sum b{display:block;font-size:17px}
.bar-in .sum span{font-size:12.5px;color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.done-h{display:flex;gap:12px;align-items:center;margin:20px 0 12px}
.check{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.steps{display:flex;margin:14px 0 4px;gap:4px}
.steps div{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.steps div::before{content:"";display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:6px}
.steps div.on{color:var(--ink)}
.steps div.on::before{background:var(--accent)}
.wa{white-space:pre-wrap;font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px;margin:10px 0;border:1px solid var(--line)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

.order{margin-bottom:10px}
.order-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.order-h h3{font-size:17px}
.order-h .meta{font-size:12.5px;color:var(--muted)}
.order ul{list-style:none;margin:10px 0;padding:0;border-top:1px solid var(--line)}
.order li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.order li .q{font-weight:600;white-space:nowrap}
.order li.changed .q{color:var(--warn)}
.order li input{width:72px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right;font-size:16px}
.order li .unit{font-size:12px;color:var(--muted);margin-left:4px}
.new{outline:2px solid var(--accent);outline-offset:-1px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-family:var(--display);font-size:24px;display:block}
.stat span{font-size:12.5px;color:var(--muted)}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.heat{position:relative}
td.buy{font-weight:700;color:var(--accent)}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.barcell i{display:block;height:8px;border-radius:4px;background:var(--accent);opacity:.75}

.quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;margin:12px 0;font-size:13px}
.quad .ax{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;justify-content:center}
.quad .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.quad .cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:86px}
.quad .cell b{display:block;font-size:14px}
.quad .cell small{color:var(--muted);display:block;margin-bottom:6px}
.quad .cell.key{border-color:var(--accent);background:var(--accent-soft)}

.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20}
@media (prefers-reduced-motion: no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}
</style>

<header class="top">
  <div class="top-row">
    <div class="brand">Surtido<i>.</i></div>
    <span class="pill">Prototipo · datos de ejemplo</span>
    <div class="seg" role="group" aria-label="Ver como">
      <button id="role-buyer" data-act="role" data-v="buyer">Restaurante</button>
      <button id="role-supplier" data-act="role" data-v="supplier">Proveedor</button>
    </div>
  </div>
  <div class="ctx" id="ctx"></div>
</header>
<main id="app"></main>
<div class="bar" id="bar" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- utilidades ---------- */
const DAY = 864e5;
const T0 = (() => { const d = new Date(); d.setHours(12,0,0,0); return d.getTime(); })();
const dateOf = d => new Date(T0 + d * DAY);
const DOW = ['dom','lun','mar','mié','jue','vie','sáb'];
const MON = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fDate = d => { const x = dateOf(d); return `${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`; };
const fDow = d => DOW[dateOf(d).getDay()];
const money = n => '$' + Math.round(n).toLocaleString('es-CO');
const median = a => { if (!a.length) return 0; const s = [...a].sort((x,y)=>x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1]+s[m]) / 2; };
const STEP = { kg: 0.5, und: 1, atado: 1 };
const roundStep = (q,u) => Math.max(STEP[u], Math.round(q / STEP[u]) * STEP[u]);
const fQty = (q,u) => u === 'kg' ? `${q.toLocaleString('es-CO',{maximumFractionDigits:1})} kg` : u === 'und' ? `${q} und` : `${q} ${q === 1 ? 'atado' : 'atados'}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let seed = 20261025; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------- catálogo del proveedor (ejemplo) ---------- */
const SUPPLIER = { name: 'Fruver La Cosecha', cutoff: '8:00 p. m.' };
const PRODUCTS = [
  ['tom','Tomate chonto','Verduras','kg',3200],['ceb','Cebolla cabezona blanca','Verduras','kg',2800],['cel','Cebolla larga','Verduras','atado',2500],
  ['pim','Pimentón rojo','Verduras','kg',4500],['lec','Lechuga crespa','Verduras','und',2200],['zan','Zanahoria','Verduras','kg',2000],
  ['pep','Pepino cohombro','Verduras','kg',2400],['cil','Cilantro','Verduras','atado',1500],['agu','Aguacate hass','Verduras','kg',9000],
  ['pap','Papa pastusa','Verduras','kg',2600],['bro','Brócoli','Verduras','kg',6000],['esp','Espinaca','Verduras','kg',8000],
  ['lim','Limón tahití','Frutas','kg',3000],['ban','Banano','Frutas','kg',2500],['fre','Fresa','Frutas','kg',9500],
  ['man','Mango tommy','Frutas','kg',4800],['pin','Piña oro miel','Frutas','und',5500],['mar','Maracuyá','Frutas','kg',6000],
  ['mor','Mora de Castilla','Frutas','kg',7000],['pay','Papaya','Frutas','kg',3000]
].map(([id,n,c,u,pr]) => ({id,n,c,u,pr}));
const PR = Object.fromEntries(PRODUCTS.map(p => [p.id,p]));

/* ---------- restaurantes y sus hábitos (ejemplo) ---------- */
const BUYERS = [
  {id:'gd', name:'GAINS Diamante', kind:'Restaurante', every:2, off:0,
   prof:{tom:[8,4],ceb:[5,4],pim:[3,4],lec:[12,2],agu:[6,2],cil:[4,2],lim:[4,4],esp:[3,4],bro:[4,4],zan:[3,6],pep:[3,4]}},
  {id:'sg', name:'Sweet Gains', kind:'Heladería', every:3, off:1,
   prof:{fre:[6,3],man:[5,6],ban:[8,3],mor:[4,6],mar:[3,6]}},
  {id:'ca', name:'Café Altamira', kind:'Cafetería', every:3, off:2,
   prof:{ban:[3,3],pay:[4,6],pin:[3,3],fre:[2,6],lim:[1,6],man:[2,6]}},
  {id:'ef', name:'Asadero El Fogón', kind:'Restaurante', every:7, off:3, stopAfter:-14,
   prof:{pap:[20,7],tom:[6,7],cel:[6,7],ceb:[6,7],lim:[5,7],cil:[3,7],agu:[3,7]}}
];
const BY = Object.fromEntries(BUYERS.map(b => [b.id,b]));

/* ---------- historial: 8 semanas de pedidos entregados ---------- */
const ORDERS = [];
let oid = 1000;
for (const b of BUYERS) {
  const last = {};
  for (let d = -56; d <= -1; d++) {
    if ((((d + b.off) % b.every) + b.every) % b.every !== 0) continue;
    if (b.stopAfter != null && d > b.stopAfter) continue;
    const items = [];
    for (const [pid,[q,i]] of Object.entries(b.prof)) {
      const inc = last[pid] == null ? rnd() < b.every / i : (d - last[pid]) >= i - 0.5;
      if (!inc) continue;
      const p = PR[pid], qty = roundStep(q * (0.85 + 0.3 * rnd()), p.u);
      const del = p.u === 'kg' && rnd() < 0.2 ? roundStep(qty * (0.92 + 0.12 * rnd()), p.u) : qty;
      items.push({p:pid, qty, del, price:p.pr, sug:false}); last[pid] = d;
    }
    if (items.length) ORDERS.push({id:++oid, b:b.id, day:d, deliver:d, status:'Entregado', items});
  }
}

/* ---------- estadísticas (las fórmulas del documento) ---------- */
const delivered = bid => ORDERS.filter(o => o.b === bid && o.status === 'Entregado').sort((a,b) => a.day - b.day);
function cadence(bid){ const ds = delivered(bid).map(o => o.day); const diffs = ds.slice(1).map((d,i) => d - ds[i]); return diffs.length ? median(diffs) : 7; }
function pstats(bid, pid){
  const rows = []; for (const o of delivered(bid)) for (const it of o.items) if (it.p === pid) rows.push({day:o.day, q:it.del});
  if (!rows.length) return null;
  const n = rows.length, last = rows[n-1];
  const ints = rows.slice(1).map((r,i) => r.day - rows[i].day);
  const intTyp = ints.length ? median(ints.slice(-6)) : cadence(bid);
  const qtyTyp = median(rows.slice(-6).map(r => r.q));
  return { n, last:last.day, lastQ:last.q, daysSince:-last.day, intTyp, qtyTyp, rate: qtyTyp / intTyp, next: last.day + intTyp };
}
function suggestions(bid){
  const cad = cadence(bid), due = [], later = [];
  const bought = new Set(); delivered(bid).forEach(o => o.items.forEach(it => bought.add(it.p)));
  for (const pid of bought) {
    const s = pstats(bid, pid), p = PR[pid];
    const atDelivery = s.daysSince + 1;
    if (atDelivery >= 0.8 * s.intTyp) {
      const q = s.n < 3 ? s.lastQ : roundStep(s.rate * Math.max(cad, s.intTyp), p.u);
      due.push({pid, q, s});
    } else later.push({pid, s});
  }
  due.sort((a,b) => (b.s.daysSince / b.s.intTyp) - (a.s.daysSince / a.s.intTyp));
  later.sort((a,b) => a.s.next - b.s.next);
  return {due, later};
}
function buyerStats(){
  const rows = BUYERS.map(b => {
    const os = delivered(b.id), last30 = os.filter(o => o.day >= -30);
    const sales = last30.reduce((t,o) => t + o.items.reduce((s,it) => s + it.del * it.price, 0), 0);
    const perWeek = last30.length / (30/7), daysSince = os.length ? -os[os.length-1].day : 99, cad = cadence(b.id);
    return { b, sales, orders:last30.length, perWeek, ticket: last30.length ? sales / last30.length : 0, daysSince, cad, risk: daysSince > 1.5 * cad };
  }).sort((a,b) => b.sales - a.sales);
  const total = rows.reduce((t,r) => t + r.sales, 0); let cum = 0;
  for (const r of rows) { r.big = cum / total < 0.8; cum += r.sales; r.share = r.sales / total; r.freq = r.perWeek >= 2;
    r.seg = r.big && r.freq ? 'Clave' : r.big ? 'Por desarrollar' : r.freq ? 'Fiel' : 'Ocasional'; }
  return rows;
}
const SEGCLS = {'Clave':'ok','Por desarrollar':'info','Fiel':'mute','Ocasional':'mute'};

/* pedidos de otros clientes para mañana (ejemplo), armados desde sus sugerencias */
for (const bid of ['sg','ca']) {
  const {due} = suggestions(bid);
  if (due.length) ORDERS.push({id:++oid, b:bid, day:0, deliver:1, status:'Recibido', created:'7:42 a. m.', items: due.map(x => ({p:x.pid, qty:x.q, del:x.q, price:PR[x.pid].pr, sug:true}))});
}

/* ---------- estado ---------- */
const S = { role:'buyer', bid:'gd', btab:'pedir', stab:'pedidos', cart:{}, sugQ:{}, cat:'Todos', q:'', placed:null, open:{}, det:{} };
try { const r = localStorage.getItem('surtido-role'); if (r === 'buyer' || r === 'supplier') S.role = r; } catch(e) {}
function resetCart(){ const {due} = suggestions(S.bid); S.cart = {}; S.sugQ = {}; due.forEach(x => { S.cart[x.pid] = x.q; S.sugQ[x.pid] = x.q; }); S.placed = null; }
resetCart();

const $ = id => document.getElementById(id);
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
const pending = bid => ORDERS.filter(o => o.b === bid && o.status !== 'Entregado');
const orderTotal = (o, f='del') => o.items.reduce((t,it) => t + it[f] * it.price, 0);
const STATUS = ['Recibido','Confirmado','En camino','Entregado'];
const stepsHtml = st => `<div class="steps">${STATUS.map((s,i) => `<div class="${i <= STATUS.indexOf(st) ? 'on' : ''}">${s}</div>`).join('')}</div>`;

/* ---------- vista restaurante ---------- */
function itemRow(pid, why, isDue){
  const p = PR[pid], q = S.cart[pid] || 0;
  const ctl = q > 0
    ? `<div class="stepper"><button data-act="dec" data-p="${pid}" aria-label="Menos ${esc(p.n)}">−</button><output>${fQty(q,p.u)}</output><button data-act="inc" data-p="${pid}" aria-label="Más ${esc(p.n)}">+</button></div>`
    : `<button class="add" data-act="inc" data-p="${pid}">Agregar</button>`;
  return `<div class="item ${q ? '' : 'off'}"><div class="name">${esc(p.n)}</div>${ctl}<div class="why">${why}</div><div class="price">${q ? money(q * p.pr) : money(p.pr) + '/' + p.u}</div></div>`;
}
function buyerPedir(){
  if (S.placed) return buyerPlaced();
  const {due, later} = suggestions(S.bid);
  const b = BY[S.bid], tomorrow = 1;
  const dueHtml = due.length ? due.map(x => {
    const s = x.s, p = PR[x.pid];
    const late = s.daysSince + 1 > s.intTyp * 1.25 ? ' <span class="tag warn">Atrasado</span>' : '';
    return itemRow(x.pid, `Último pedido hace ${s.daysSince} ${s.daysSince === 1 ? 'día' : 'días'} · sueles pedir ${fQty(s.qtyTyp,p.u)} cada ${Math.round(s.intTyp)} días${late}`, true);
  }).join('') : `<div class="empty">Nada por reponer para mañana.</div>`;
  const laterHtml = later.map(x => itemRow(x.pid, `Te alcanza hasta el ${fDate(Math.round(x.s.next))}`, false)).join('');
  const extra = Object.keys(S.cart).filter(pid => S.cart[pid] > 0 && !due.some(x => x.pid === pid) && !later.some(x => x.pid === pid));
  return `
  <div class="delivery"><div class="day">${dateOf(tomorrow).getDate()}<small>${fDow(tomorrow)}</small></div>
    <div><b>Entrega mañana · ${fDate(tomorrow)}</b><span>${SUPPLIER.name} · pide antes de las ${SUPPLIER.cutoff}</span></div></div>
  <div class="sec-h"><h2>Tu pedido sugerido</h2><button class="act" data-act="reset">Repetir sugerido</button></div>
  <p class="sub">Calculado con tus últimos pedidos. Ajusta con − y +.</p>
  <div class="list">${dueHtml}${extra.map(pid => itemRow(pid, 'Agregado por ti', false)).join('')}</div>
  ${later.length ? `<details class="more" id="later-d" ${S.det['later-d'] ? 'open' : ''}><summary>Aún no te toca (${later.length})</summary><div class="list">${laterHtml}</div></details>` : ''}
  <details class="more" id="cat-d" ${S.det['cat-d'] ? 'open' : ''}><summary>Agregar otro producto</summary>
    <input class="search" id="search" type="search" placeholder="Buscar: tomate, fresa…" value="${esc(S.q)}" autocomplete="off">
    <div class="chips">${['Todos','Verduras','Frutas'].map(c => `<button data-act="cat" data-v="${c}" aria-pressed="${S.cat === c}">${c}</button>`).join('')}</div>
    <div class="list" id="catalog">${catalogHtml()}</div>
  </details>
  <details class="how"><summary>Así se calcula la sugerencia</summary><ul>
    <li>Cantidad típica = mediana de lo que te entregaron en tus últimos 6 pedidos del producto.</li>
    <li>Intervalo típico = mediana de días entre esos pedidos.</li>
    <li>Se sugiere cuando, al día de entrega, ya pasó el 80% de tu intervalo típico.</li>
    <li>Cantidad sugerida = consumo diario × días hasta tu siguiente pedido (${b.name} pide cada ${cadence(S.bid)} días).</li>
  </ul></details>`;
}
function catalogHtml(){
  const q = S.q.trim().toLowerCase();
  const rows = PRODUCTS.filter(p => (S.cat === 'Todos' || p.c === S.cat) && (!q || p.n.toLowerCase().includes(q)));
  return rows.length ? rows.map(p => itemRow(p.id, p.c, false)).join('') : `<div class="empty">No hay productos con “${esc(S.q)}”.</div>`;
}
function buyerPlaced(){
  const o = ORDERS.find(x => x.id === S.placed); const b = BY[o.b];
  const txt = `Hola, pedido de ${b.name} para ${fDate(o.deliver)}:\n` + o.items.map(it => `• ${PR[it.p].n}: ${fQty(it.qty, PR[it.p].u)}`).join('\n') + `\nTotal aprox: ${money(orderTotal(o,'qty'))}`;
  return `
  <div class="done-h"><div class="check" aria-hidden="true">✓</div><div><h2>Pedido enviado</h2><p class="sub" style="margin:2px 0 0">#${o.id} · entrega ${fDate(o.deliver)}</p></div></div>
  <div class="card">${stepsHtml(o.status)}
    <p class="sub" style="margin-top:10px">${o.status === 'Recibido' ? `${SUPPLIER.name} lo verá en su panel. Cambia a la vista Proveedor para confirmarlo.` : o.status === 'Confirmado' ? 'El proveedor confirmó tu pedido.' : o.status === 'En camino' ? 'Tu pedido va en camino. Revísalo al recibirlo.' : 'Recibido. Gracias.'}</p>
    <ul style="list-style:none;padding:0;margin:8px 0 0">${o.items.map(it => `<li style="display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)"><span>${esc(PR[it.p].n)}</span><b>${fQty(it.qty, PR[it.p].u)}</b></li>`).join('')}</ul>
  </div>
  <h3 style="font-size:16px;margin:18px 0 0">Resumen para WhatsApp</h3>
  <p class="sub">Mientras el proveedor se acostumbra al panel, puedes mandarle esto.</p>
  <div class="wa" id="wa-text">${esc(txt)}</div>
  <div class="row-btns"><button class="ghost" data-act="copy">Copiar resumen</button><button class="ghost" data-act="again">Hacer otro pedido</button></div>`;
}
function buyerHist(){
  const os = ORDERS.filter(o => o.b === S.bid).sort((a,b) => b.deliver - a.deliver).slice(0, 12);
  return `<div class="sec-h"><h2>Mis pedidos</h2></div>` + os.map(o => {
    const open = S.open['h' + o.id];
    const st = o.status === 'Entregado' ? 'mute' : o.status === 'En camino' ? 'warn' : 'ok';
    return `<div class="card order">
      <div class="order-h"><div><h3>${fDate(o.deliver)}</h3><div class="meta">#${o.id} · ${o.items.length} productos · ${money(orderTotal(o))}</div></div><span class="tag ${st}">${o.status}</span></div>
      ${open || o.status !== 'Entregado' ? `<ul>${o.items.map(it => `<li class="${it.del !== it.qty ? 'changed' : ''}"><span>${esc(PR[it.p].n)}</span><span class="q">${it.del !== it.qty ? `<s style="color:var(--muted);font-weight:400">${fQty(it.qty, PR[it.p].u)}</s> ` : ''}${fQty(it.del, PR[it.p].u)}</span></li>`).join('')}</ul>` : ''}
      <div class="row-btns">${o.status === 'En camino' ? `<button class="primary" data-act="receive" data-o="${o.id}">Recibí todo bien</button>` : ''}
      ${o.status === 'Entregado' ? `<button class="ghost" data-act="toggle" data-k="h${o.id}">${open ? 'Ocultar' : 'Ver productos'}</button>` : ''}</div>
    </div>`;
  }).join('');
}

/* ---------- vista proveedor ---------- */
function supPedidos(){
  const os = ORDERS.filter(o => o.deliver === 1 && o.status !== 'Entregado').sort((a,b) => STATUS.indexOf(a.status) - STATUS.indexOf(b.status));
  const segs = Object.fromEntries(buyerStats().map(r => [r.b.id, r]));
  const tot = os.reduce((t,o) => t + orderTotal(o,'qty'), 0);
  return `<div class="sec-h"><h2>Pedidos para mañana · ${fDate(1)}</h2></div>
  <p class="sub">${os.length} pedidos · ${money(tot)} · cierre a las ${SUPPLIER.cutoff}</p>
  ${os.length ? os.map(o => {
    const r = segs[o.b]; const isNew = o.id === S.placed;
    return `<div class="card order ${isNew ? 'new' : ''}">
      <div class="order-h"><div><h3>${esc(BY[o.b].name)} ${isNew ? '<span class="tag ok">Nuevo</span>' : ''}</h3>
        <div class="meta">#${o.id} · ${o.created || 'hace un momento'} · <span class="tag ${SEGCLS[r.seg]}">${r.seg}</span></div></div>
        <span class="tag ${o.status === 'Recibido' ? 'warn' : 'ok'}">${o.status}</span></div>
      <ul>${o.items.map((it,i) => { const p = PR[it.p];
        return `<li class="${it.del !== it.qty ? 'changed' : ''}"><span>${esc(p.n)}<br><small style="color:var(--muted)">Pidió ${fQty(it.qty,p.u)}</small></span>
          ${o.status === 'Recibido' ? `<span><input id="d-${o.id}-${i}" type="number" inputmode="decimal" step="${STEP[p.u]}" min="0" value="${it.del}" data-act="del" data-o="${o.id}" data-i="${i}" aria-label="Cantidad entregada de ${esc(p.n)}"><span class="unit">${p.u}</span></span>` : `<span class="q">${fQty(it.del,p.u)}</span>`}</li>`; }).join('')}</ul>
      <div class="row-btns">${o.status === 'Recibido' ? `<button class="primary" data-act="confirm" data-o="${o.id}">Confirmar pedido</button>` : o.status === 'Confirmado' ? `<button class="primary" data-act="ship" data-o="${o.id}">Marcar en camino</button>` : `<span class="sub">Esperando que el cliente confirme la recepción.</span>`}</div>
    </div>`; }).join('') : `<div class="card empty">Todavía no hay pedidos para mañana.</div>`}
  <p class="sub">En productos por kilo puedes ajustar el peso real antes de confirmar; el cliente ve el cambio y las estadísticas usan lo entregado.</p>`;
}
function supAlist(){
  const os = ORDERS.filter(o => o.deliver === 1 && o.status !== 'Entregado'), agg = {};
  os.forEach(o => o.items.forEach(it => { const a = agg[it.p] ||= {q:0, n:0, who:[]}; a.q += it.del; a.n++; a.who.push(BY[o.b].name); }));
  const rows = Object.entries(agg).sort((a,b) => b[1].q * PR[b[0]].pr - a[1].q * PR[a[0]].pr);
  const max = Math.max(1, ...rows.map(([,a]) => a.q));
  return `<div class="sec-h"><h2>Alistamiento · ${fDate(1)}</h2></div><p class="sub">Todo lo que sale mañana, sumado por producto.</p>
  ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>Total</th><th>Pedidos</th><th>Clientes</th></tr></thead><tbody>
  ${rows.map(([pid,a]) => `<tr><td>${esc(PR[pid].n)}</td><td><div class="barcell"><i style="width:${Math.round(a.q / max * 60)}px"></i><b>${fQty(a.q, PR[pid].u)}</b></div></td><td>${a.n}</td><td style="text-align:left;color:var(--muted)">${esc(a.who.join(', '))}</td></tr>`).join('')}
  </tbody></table></div>` : `<div class="card empty">Sin pedidos para mañana.</div>`}`;
}
function supClientes(){
  const rows = buyerStats(), by = s => rows.filter(r => r.seg === s);
  const cell = (s, d, key) => `<div class="cell ${key ? 'key' : ''}"><b>${s}</b><small>${d}</small>${by(s).map(r => `<div>${esc(r.b.name)} ${r.risk ? '<span class="tag bad">En riesgo</span>' : ''}</div>`).join('') || '<div style="color:var(--muted)">—</div>'}</div>`;
  const risk = rows.filter(r => r.risk);
  return `<div class="sec-h"><h2>Clientes</h2></div><p class="sub">Últimos 30 días. Grande = clientes que suman el 80% de las ventas. Frecuente = 2 o más pedidos por semana.</p>
  ${risk.map(r => `<div class="card" style="border-color:var(--bad);margin-bottom:10px"><b>${esc(r.b.name)} lleva ${r.daysSince} días sin pedir.</b><div class="sub" style="margin:2px 0 0">Normalmente pide cada ${r.cad} días. Vale la pena llamarlo.</div></div>`).join('')}
  <div class="quad">
    <div></div><div class="ax">Frecuente</div><div class="ax">Esporádico</div>
    <div class="ax v">Grande</div>${cell('Clave','Prioridad en despacho y stock', true)}${cell('Por desarrollar','Ofrecer más días de entrega')}
    <div class="ax v">Pequeño</div>${cell('Fiel','Mantener servicio')}${cell('Ocasional','Atención estándar')}
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Ventas 30 d</th><th>% ventas</th><th>Pedidos/sem</th><th>Ticket</th><th>Último pedido</th><th>Segmento</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td>${esc(r.b.name)}</td><td>${money(r.sales)}</td><td>${Math.round(r.share * 100)}%</td><td>${r.perWeek.toLocaleString('es-CO',{maximumFractionDigits:1})}</td><td>${money(r.ticket)}</td><td>${r.risk ? `<span class="tag bad">hace ${r.daysSince} d</span>` : `hace ${r.daysSince} d`}</td><td style="text-align:left"><span class="tag ${SEGCLS[r.seg]}">${r.seg}</span></td></tr>`).join('')}
  </tbody></table></div>`;
}
function supPrev(){
  const days = [1,2,3,4,5,6,7], f = {}, risky = new Set(buyerStats().filter(r => r.risk).map(r => r.b.id));
  for (const b of BUYERS) {
    if (risky.has(b.id)) continue;
    const pend = ORDERS.find(o => o.b === b.id && o.deliver === 1 && o.status !== 'Entregado');
    const bought = new Set(); delivered(b.id).forEach(o => o.items.forEach(it => bought.add(it.p)));
    for (const pid of bought) {
      const s = pstats(b.id, pid); if (s.n < 2) continue;
      const row = f[pid] ||= Object.fromEntries(days.map(d => [d,0]));
      let t = s.last + s.intTyp;
      if (pend) { const it = pend.items.find(x => x.p === pid); if (it) { row[1] += it.del; t = 1 + s.intTyp; } else if (t < 2) t = 2; }
      else if (t < 1) t = 1;
      while (t <= 7.5) { const d = Math.min(7, Math.max(1, Math.round(t))); row[d] += s.qtyTyp; t += s.intTyp; }
    }
  }
  const rows = Object.entries(f).filter(([,r]) => days.some(d => r[d] > 0)).sort((a,b) => (b[1][1] + b[1][2]) * PR[b[0]].pr - (a[1][1] + a[1][2]) * PR[a[0]].pr);
  const max = Math.max(1, ...rows.flatMap(([pid,r]) => days.map(d => r[d] * PR[pid].pr)));
  const cellBg = v => v ? `background:color-mix(in srgb, var(--accent) ${Math.round(8 + 32 * v / max)}%, transparent)` : '';
  const buyTotal = rows.reduce((t,[pid,r]) => t + roundStep(r[1] * 1.1, PR[pid].u) * PR[pid].pr, 0);
  return `<div class="sec-h"><h2>Previsión de compra</h2></div>
  <p class="sub">Lo que esperas vender cada día según el ritmo de cada cliente. Mañana combina pedidos ya recibidos y pedidos esperados. No incluye clientes en riesgo.</p>
  <div class="grid2"><div class="stat"><b>${money(buyTotal)}</b><span>Compra sugerida para mañana (con 10% de colchón)</span></div>
    <div class="stat"><b>${rows.length}</b><span>Productos con demanda esta semana</span></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>Comprar hoy</th>${days.map(d => `<th>${fDow(d)} ${dateOf(d).getDate()}</th>`).join('')}<th>Semana</th></tr></thead><tbody>
  ${rows.map(([pid,r]) => { const p = PR[pid], wk = days.reduce((t,d) => t + r[d], 0);
    return `<tr><td>${esc(p.n)}</td><td class="buy">${r[1] ? fQty(roundStep(r[1] * 1.1, p.u), p.u) : '—'}</td>${days.map(d => `<td class="heat" style="${cellBg(r[d] * p.pr)}">${r[d] ? fQty(roundStep(r[d], p.u), p.u) : ''}</td>`).join('')}<td><b>${fQty(roundStep(wk, p.u), p.u)}</b></td></tr>`; }).join('')}
  </tbody></table></div>
  <details class="how"><summary>Así se calcula</summary><ul>
    <li>Por cada cliente y producto: próximo pedido esperado = último pedido + intervalo típico, y así sucesivamente durante 7 días.</li>
    <li>Cada pedido esperado suma la cantidad típica de ese cliente.</li>
    <li>“Comprar hoy” = lo de mañana + 10%. Ese colchón se ajusta comparando previsión contra lo vendido.</li>
  </ul></details>`;
}

/* ---------- render ---------- */
function render(){
  $('role-buyer').setAttribute('aria-pressed', S.role === 'buyer');
  $('role-supplier').setAttribute('aria-pressed', S.role === 'supplier');
  const app = $('app'), bar = $('bar');
  if (S.role === 'buyer') {
    $('ctx').innerHTML = `<label for="buyer-sel">Pidiendo como</label><select id="buyer-sel">${BUYERS.map(b => `<option value="${b.id}" ${b.id === S.bid ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select><span>a ${SUPPLIER.name}</span>`;
    app.className = 'wrap';
    app.innerHTML = `<nav class="tabs">${[['pedir','Pedir'],['hist','Mis pedidos']].map(([k,l]) => `<button data-act="btab" data-v="${k}" aria-pressed="${S.btab === k}">${l}</button>`).join('')}</nav>` + (S.btab === 'pedir' ? buyerPedir() : buyerHist());
    const items = Object.entries(S.cart).filter(([,q]) => q > 0);
    if (S.btab === 'pedir' && !S.placed) {
      const tot = items.reduce((t,[pid,q]) => t + q * PR[pid].pr, 0);
      bar.hidden = false;
      bar.innerHTML = `<div class="bar-in"><div class="sum"><b>${money(tot)}</b><span>${items.length} productos · precio de referencia</span></div><button class="primary" data-act="place" ${items.length ? '' : 'disabled'}>Confirmar pedido</button></div>`;
    } else bar.hidden = true;
  } else {
    $('ctx').innerHTML = `<span>Panel de <b style="color:var(--ink)">${SUPPLIER.name}</b></span>`;
    app.className = 'wrap wide'; bar.hidden = true;
    const n = ORDERS.filter(o => o.deliver === 1 && o.status === 'Recibido').length;
    app.innerHTML = `<nav class="tabs">${[['pedidos',`Pedidos${n ? ` (${n})` : ''}`],['alist','Alistamiento'],['clientes','Clientes'],['prev','Previsión']].map(([k,l]) => `<button data-act="stab" data-v="${k}" aria-pressed="${S.stab === k}">${l}</button>`).join('')}</nav>` +
      ({pedidos:supPedidos, alist:supAlist, clientes:supClientes, prev:supPrev}[S.stab])();
  }
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, pid = el.dataset.p;
  if (a === 'role') { S.role = v; try { localStorage.setItem('surtido-role', v); } catch(e) {} window.scrollTo(0,0); }
  else if (a === 'btab') S.btab = v;
  else if (a === 'stab') S.stab = v;
  else if (a === 'inc') { const u = PR[pid].u; S.cart[pid] = (S.cart[pid] || 0) + STEP[u]; }
  else if (a === 'dec') { const u = PR[pid].u; S.cart[pid] = Math.max(0, (S.cart[pid] || 0) - STEP[u]); }
  else if (a === 'reset') { resetCart(); toast('Pedido sugerido restaurado'); }
  else if (a === 'cat') { S.cat = v; $('catalog').innerHTML = catalogHtml(); document.querySelectorAll('[data-act="cat"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); return; }
  else if (a === 'place') {
    const items = Object.entries(S.cart).filter(([,q]) => q > 0).map(([p,q]) => ({p, qty:q, del:q, price:PR[p].pr, sug: S.sugQ[p] === q}));
    if (!items.length) return;
    const o = {id:++oid, b:S.bid, day:0, deliver:1, status:'Recibido', created:'hace un momento', items};
    ORDERS.push(o); S.placed = o.id; window.scrollTo(0,0);
  }
  else if (a === 'again') { resetCart(); window.scrollTo(0,0); }
  else if (a === 'copy') { const txt = $('wa-text').textContent;
    const ok = () => toast('Resumen copiado'), fail = () => { const r = document.createRange(); r.selectNodeContents($('wa-text')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto seleccionado: cópialo'); };
    try { navigator.clipboard.writeText(txt).then(ok, fail); } catch(err) { fail(); } return; }
  else if (a === 'toggle') S.open[el.dataset.k] = !S.open[el.dataset.k];
  else if (a === 'confirm') { const o = ORDERS.find(x => x.id === +el.dataset.o); o.status = 'Confirmado'; toast(`Pedido de ${BY[o.b].name} confirmado`); }
  else if (a === 'ship') { const o = ORDERS.find(x => x.id === +el.dataset.o); o.status = 'En camino'; toast('Marcado en camino'); }
  else if (a === 'receive') { const o = ORDERS.find(x => x.id === +el.dataset.o); o.status = 'Entregado'; o.day = 1; toast('Pedido recibido. Las sugerencias se actualizan.'); }
  else return;
  render();
});
document.addEventListener('change', e => {
  if (e.target.id === 'buyer-sel') { S.bid = e.target.value; S.btab = 'pedir'; resetCart(); render(); }
  if (e.target.dataset.act === 'del') { const o = ORDERS.find(x => x.id === +e.target.dataset.o), it = o.items[+e.target.dataset.i];
    const v = parseFloat(String(e.target.value).replace(',', '.')); it.del = isNaN(v) || v < 0 ? it.qty : v; render(); }
});
document.addEventListener('toggle', e => { if (e.target.id) S.det[e.target.id] = e.target.open; }, true);
document.addEventListener('input', e => { if (e.target.id === 'search') { S.q = e.target.value; $('catalog').innerHTML = catalogHtml(); } });
render();
</script>
