<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Surtido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<style>
/* Layout: app de una columna estilo iOS (máx 640px). Título grande arriba, listas agrupadas, barra de pestañas translúcida abajo, hojas que suben desde abajo para formularios. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#F2F2F7; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --accent:#007AFF; --green:#248A3D; --green-b:#34C759; --orange:#C93400; --orange-b:#FF9500; --red:#D70015; --red-b:#FF3B30; --purple:#8944AB;
  --bar:rgba(249,249,249,.82); --scrim:rgba(0,0,0,.32); --shadow:0 10px 40px rgba(0,0,0,.18);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --tabh:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --accent:#0A84FF; --green:#30D158; --green-b:#30D158; --orange:#FF9F0A; --orange-b:#FF9F0A; --red:#FF453A; --red-b:#FF453A; --purple:#BF5AF2;
  --bar:rgba(22,22,24,.82); --scrim:rgba(0,0,0,.5); --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --accent:#0A84FF; --green:#30D158; --green-b:#30D158; --orange:#FF9F0A; --orange-b:#FF9F0A; --red:#FF453A; --red-b:#FF453A; --purple:#BF5AF2;
  --bar:rgba(22,22,24,.82); --scrim:rgba(0,0,0,.5); --shadow:0 10px 40px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--label);font-family:var(--font);margin:0;font-size:17px;line-height:1.35;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabh) + 120px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:none;border:0;padding:0}
input,select,textarea{font-size:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.app{max-width:640px;margin:0 auto}

/* títulos */
.navbar{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding-top:6px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;margin-left:-6px;padding:6px}
.back svg{width:22px;height:22px}
.navbtn{color:var(--accent);font-size:17px;padding:6px 0}
.navbtn.strong{font-weight:600}
.navbtn svg{width:28px;height:28px;display:block}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 0 4px}
.lt h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em}
.lt-sub{color:var(--label2);font-size:15px;margin:0 0 6px}
.pill-proto{font-size:11px;font-weight:600;color:var(--label2);background:var(--fill);border-radius:6px;padding:2px 6px;vertical-align:middle;letter-spacing:.02em}

/* grupos estilo lista iOS */
.grp{margin:22px 0 0}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 16px 7px;font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--label2)}
.grp-h .navbtn{text-transform:none;font-size:15px;letter-spacing:0;padding:0}
.grp-h.big{text-transform:none;font-size:22px;font-weight:700;color:var(--label);padding:0 0 8px;letter-spacing:.01em}
.grp-b{background:var(--surface);border-radius:12px;overflow:hidden}
.grp-f{padding:7px 16px 0;font-size:13px;color:var(--label2)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:11px 16px;text-align:left;position:relative;background:var(--surface)}
.row + .row::before,.row + .rowx::before,.rowx + .row::before,.rowx + .rowx::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.rowx{position:relative;background:var(--surface)}
button.row{transition:background-color 120ms ease}
button.row:active{background:var(--fill)}
.row-main{flex:1;min-width:0;display:grid;gap:2px}
.row-t{font-size:17px;line-height:22px}
.row-t b{font-weight:600}
.row-s{font-size:15px;line-height:20px;color:var(--label2)}
.row-r{display:flex;align-items:center;gap:8px;color:var(--label2);font-size:17px;white-space:nowrap}
.chev{width:14px;height:14px;color:var(--label3);flex:none}
.av{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:600;flex:none;letter-spacing:0}
.av.ink{color:#1d1d1f}
.badge{min-width:22px;height:22px;border-radius:11px;padding:0 7px;display:inline-grid;place-items:center;font-size:13px;font-weight:600;color:#fff;background:var(--red-b)}
.badge.blue{background:var(--accent)}
.badge.gray{background:var(--fill2);color:var(--label)}

/* chips de estado */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;line-height:18px}
.tag.ok{color:var(--green);background:color-mix(in srgb,var(--green-b) 15%,transparent)}
.tag.warn{color:var(--orange);background:color-mix(in srgb,var(--orange-b) 16%,transparent)}
.tag.bad{color:var(--red);background:color-mix(in srgb,var(--red-b) 14%,transparent)}
.tag.info{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.tag.mute{color:var(--label2);background:var(--fill)}

/* tarjetas de novedades */
.feed{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 0 4px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;scroll-padding-left:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.fc{flex:0 0 min(80%,290px);scroll-snap-align:start;background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-height:132px}
.fc p{font-size:15px;line-height:20px}
.fc .acts{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 18px;font-size:17px;font-weight:600;background:var(--accent);color:#fff;transition:transform 140ms var(--ease-out),opacity 140ms ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default}
.btn.full{width:100%}
.btn.tint{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.sm{padding:7px 14px;font-size:15px;border-radius:18px}
.btn.danger{background:color-mix(in srgb,var(--red-b) 14%,transparent);color:var(--red)}
.link{color:var(--accent);font-size:15px}
.link:active{opacity:.5}

/* control segmentado */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:7px 8px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label);transition:background-color 160ms ease}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}

/* stepper */
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:9px;height:34px;flex:none}
.stepper button{width:38px;height:34px;font-size:20px;font-weight:500;color:var(--label);display:grid;place-items:center;border-radius:9px;transition:background-color 100ms ease}
.stepper button:active{background:var(--fill2)}
.stepper output{min-width:58px;text-align:center;font-size:15px;font-weight:600}
.addbtn{background:var(--fill);color:var(--accent);font-weight:600;font-size:15px;border-radius:17px;padding:7px 14px;flex:none;transition:transform 120ms var(--ease-out)}
.addbtn:active{transform:scale(.96)}

/* tarjeta de entrega */
.hero-card{background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin-top:10px}
.cal{width:48px;border-radius:10px;overflow:hidden;text-align:center;flex:none;background:var(--surface2)}
.cal small{display:block;background:var(--red-b);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-size:22px;line-height:30px;font-weight:600}
.hero-card .t{font-size:17px;font-weight:600}
.hero-card .s{font-size:15px;color:var(--label2)}

/* ofertas */
.deals{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 16px 4px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.deals::-webkit-scrollbar{display:none}
.deal{flex:0 0 min(64%,220px);scroll-snap-align:start;background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px}
.deal .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.pct{background:var(--red-b);color:#fff;font-weight:700;border-radius:7px;padding:2px 7px;font-size:13px}
.deal b{font-size:15px;line-height:20px}
.deal .s{font-size:13px;color:var(--label2);line-height:17px}
.price b{font-size:17px}
.price s{color:var(--label2);font-size:13px;margin-left:4px}
.deal .addbtn,.deal .stepper{align-self:flex-start;margin-top:4px}

/* inventario */
.cov{position:relative;height:6px;border-radius:3px;background:var(--fill);margin-top:8px}
.cov i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--green-b)}
.cov i.bad{background:var(--red-b)} .cov i.warn{background:var(--orange-b)} .cov i.info{background:var(--accent)}
.cov s{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--label)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:0}
.stat span{font-size:12px;color:var(--label2);line-height:15px;display:block}
.meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent)}

/* días */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{height:36px;border-radius:9px;background:var(--fill);font-size:14px;font-weight:600;color:var(--label2);transition:background-color 120ms ease,transform 120ms var(--ease-out)}
.days button:active{transform:scale(.95)}
.days button[aria-pressed="true"]{background:var(--accent);color:#fff}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.strip div{border-radius:9px;padding:6px 2px;text-align:center;font-size:11px;color:var(--label2);background:var(--fill);min-width:0}
.strip div b{display:block;font-size:12px;color:var(--label);font-weight:600}
.strip .alto{background:color-mix(in srgb,var(--orange-b) 20%,transparent)}
.strip .normal{background:color-mix(in srgb,var(--green-b) 18%,transparent)}
.strip .suave{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.strip .cerrado{opacity:.4}

/* formularios en hoja */
.field{display:grid;gap:6px;min-width:0}
.field>label,.flabel{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:0 4px}
.inp{width:100%;background:var(--surface);border:0;border-radius:10px;padding:11px 14px;font-size:17px;min-height:44px}
.sheet .inp{background:var(--surface)}
textarea.inp{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.hint{font-size:13px;color:var(--label2);padding:0 4px}
.err{color:var(--red);font-size:15px;font-weight:500}
.fgrid{display:grid;gap:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* tablas */
.tbl{overflow-x:auto;background:var(--surface);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:.5px solid var(--sep);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{font-size:12px;color:var(--label2);font-weight:500}
tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}
td.buy{font-weight:600;color:var(--accent)}
td input{width:92px;text-align:right;background:var(--fill);border:0;border-radius:8px;padding:6px 8px;font-size:16px}

/* barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--label2);font-size:10px;font-weight:500;position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:11px;padding:0 5px}
.checkout{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:19;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.checkout-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.checkout .sum{flex:1;min-width:0}
.checkout .sum b{display:block;font-size:17px}
.checkout .sum span{font-size:13px;color:var(--label2)}

/* hojas */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity 300ms ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100dvh - 44px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--bg);border-radius:14px 14px 0 0;box-shadow:var(--shadow);
  transform:translateY(100%);transition:transform 360ms var(--ease-drawer);max-width:640px;margin:0 auto}
.sheet-root.open .scrim{opacity:1}
.sheet-root.open .sheet{transform:translateY(0)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:7px auto 0;flex:none}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 16px 8px;touch-action:none;flex:none}
.sheet-h b{font-size:17px;font-weight:600;text-align:center}
.sheet-h .navbtn:last-child{justify-self:end}
.sheet-h .navbtn:first-child{justify-self:start}
.sheet-b{overflow-y:auto;overscroll-behavior:contain;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-b .grp:first-child{margin-top:4px}

/* entrada */
.login{max-width:420px;margin:0 auto;padding-top:56px}
.login h1{font-size:34px;font-weight:700;margin-bottom:6px}
.code-in{letter-spacing:.4em;text-align:center;font-weight:600;font-size:24px !important}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 82px + env(safe-area-inset-bottom,0px));z-index:50;transform:translateX(-50%);background:var(--label);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:15px;font-weight:500;max-width:calc(100% - 32px);width:max-content;box-shadow:var(--shadow);
  transition:opacity 220ms ease,transform 260ms var(--ease-out)}
.toast[data-hide]{opacity:0;transform:translate(-50%,8px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:0 16px 2px max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:17px;background:var(--surface);font-size:15px;font-weight:500;color:var(--label);white-space:nowrap;transition:background-color 140ms ease,transform 120ms var(--ease-out)}
.chip:active{transform:scale(.96)}
.chip small{color:var(--label2);font-size:13px;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--label);color:var(--bg)}
.chip[aria-pressed="true"] small{color:var(--bg);opacity:.7}
.ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ntile{background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:grid;gap:2px;min-width:0;transition:transform 120ms var(--ease-out),background-color 120ms ease}
.ntile:active{transform:scale(.97);background:var(--fill)}
.ntile b{font-size:22px;font-weight:700;line-height:1.1}
.ntile span{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntile.bad b{color:var(--red)} .ntile.warn b{color:var(--orange)} .ntile.ok b{color:var(--green)} .ntile.info b{color:var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ctile{background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:grid;gap:10px;min-width:0;min-height:118px;align-content:space-between;transition:transform 120ms var(--ease-out),background-color 120ms ease}
.ctile:active{transform:scale(.97);background:var(--fill)}
.ctile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ctile b{font-size:17px;font-weight:600;line-height:21px}
.ctile .s{font-size:13px;color:var(--label2)}
.newslist{display:grid;gap:10px}
.newslist .fc{min-height:0}
.task{background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:8px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.task-k{font-size:13px;color:var(--accent);font-weight:600}
.task b{font-size:20px;line-height:25px}
.task p{font-size:15px;color:var(--label2)}
.aicta{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border-radius:16px;padding:14px 16px;margin-top:12px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform 120ms var(--ease-out)}
.aicta:active{transform:scale(.98)}
.aicta>span:nth-child(2){flex:1;min-width:0;display:grid}
.aicta b{font-size:17px}
.aicta>span:nth-child(2)>span{font-size:14px;color:var(--label2)}
.spark{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),#AF52DE)}
.spark svg{width:22px;height:22px}

/* ---------- historial: 8 semanas generadas desde el consumo de cada menú ---------- */
const EXTRA = {tom:1.6, lec:1.6, ceb:1.5, lev:1.35, moz:1.3, pap:1.15, bre:1.1, tbb:1.05};
const DRIFT = {agu:1.1, c90:0.95, tom:0.94};
const ORDERS = [];
let oid = 1000;
for (const b of BUYERS) for (const sid of b.sups) {
  const od = b.orderDays[sid]; if (!od) continue;
  const stock = {}, lastD = {};
  for (let d = -56; d <= -1; d++) {
    if (!od.includes(wd(d)) || (b.stopAfter != null && d > b.stopAfter)) continue;
    let n = d + 1; while (!od.includes(wd(n))) n++;
    const items = [];
    for (const pid of menuProducts(b.id, sid)) {
      const rate = theo(b.id, pid, true) * (EXTRA[pid] || 1.25), real = rate * (0.9 + 0.2 * rnd());
      if (lastD[pid] != null) stock[pid] = Math.max(0, (stock[pid] || 0) - consume(b.id, real, lastD[pid], d));
      const target = consume(b.id, rate, d, n) + rate * 1.5;   // lo que viene hasta la próxima entrega + día y medio de colchón
      const p = PR[pid], gap = target - (stock[pid] || 0); lastD[pid] = d;
      if (gap < STEP[p.u] / 2) continue;
      const qty = roundStep(gap, p.u), del = p.u === 'kg' && rnd() < 0.2 ? roundStep(qty * (0.94 + 0.08 * rnd()), p.u) : qty;
      stock[pid] = (stock[pid] || 0) + del;
      items.push({p:pid, qty, del, price: Math.round(p.pr * (DRIFT[pid] || 1) / 50) * 50});
    }
    if (items.length) ORDERS.push({id:++oid, b:b.id, s:sid, day:d, deliver:d, status:'Entregado', items});
  }
}

function pstats(bid, pid){
  const rows = []; for (const o of delivered(bid)) for (const it of o.items) if (it.p === pid) rows.push({day:o.day, q:it.del});
  if (!rows.length) return null;

}

const CORR = {};

  const all = deliveriesOf(bid,pid), th = theo(bid,pid), thBase = theo(bid,pid,true);
  if (!all.length || (all.length < 2 && !th)) return null;
  const w = all.slice(-7), p = PR[pid], s = pstats(bid,pid), now = nowT(bid);
  let hist = 0;
  if (w.length >= 2) { const used = w.slice(0,-1).reduce((t,r) => t + r.q, 0), days = consume(bid, 1, w[0].day, w[w.length-1].day); hist = days > 0 ? used / days : s.rate; }

  for (const r of w) { stock = Math.max(0, stock - consume(bid, rate, prev, r.day)) + r.q; prev = r.day; }
  const last = w[w.length-1], anchored = c.anchor && c.anchor.day >= last.day;

const URG = {bad:0, warn:1, info:2, ok:3};
function inventory(bid, sid){

    const ps = m.p.s, D = nextDelivery(ps), cad = delivered(bid, ps).length >= 2 ? cadence(bid, ps) : 3;
    const inc = m.incoming.length ? Math.min(...m.incoming.map(x => x.day)) : null, out = m.out, u = m.p.u, H = Math.max(cad, m.intTyp);
    m.D = D;

    else if (inc != null) Object.assign(m, out < inc ? {cls:'bad', label:'Se acaba antes de que llegue'} : {cls:'info', label:`Llega ${relDay(inc)}`});

function supPrev(){
  const sid = SID(), days = [1,2,3,4,5,6,7], f = {}, sp = sup(sid), risky = new Set(buyerStats(sid).filter(r => r.risk).map(r => r.b.id));
  for (const b of clientsOf(sid)) {
    if (risky.has(b.id)) continue;
    const pend = pendingOrders(sid).filter(o => o.b === b.id && o.deliver >= 1 && o.deliver <= 7);
    for (const o of pend) for (const it of o.items) { const r = f[it.p] ||= Object.fromEntries(days.map(d => [d,0])); r[o.deliver] += it.del; }
    for (const pid of boughtSet(b.id, sid)) {
      const s = pstats(b.id, pid); if (s.n < 2) continue;
      const r = f[pid] ||= Object.fromEntries(days.map(d => [d,0]));
      const real = pend.find(o => o.items.some(x => x.p === pid));
      let t = real ? real.deliver + s.intTyp : Math.max(1, s.last + s.intTyp);
      while (t <= 7.5) { const d = Math.min(7, Math.max(1, Math.round(t))); if (sp.days.includes(wd(d))) r[d] += s.qtyTyp; else { const n = days.find(x => x > d && sp.days.includes(wd(x))); if (n) r[n] += s.qtyTyp; } t += s.intTyp; }
    }
  }
  const D = nextDelivery(sid), dd = days.filter(d => sp.days.includes(wd(d)));
  const rows = Object.entries(f).filter(([pid,r]) => PR[pid].active && days.some(d => r[d] > 0));
  const buyTotal = rows.reduce((t,[pid,r]) => t + (r[D] ? roundStep(r[D] * 1.1, PR[pid].u) * PR[pid].pr : 0), 0);
  return lt('Qué comprar', 'Próximos 7 días') + `<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat"><b>${money(buyTotal)}</b><span>Te toca comprar para ${relDay(D)}, con 10% extra por si acaso</span></div><div class="stat"><b>${rows.length}</b><span>Productos que te van a pedir</span></div></div>` +
    grp(`Comprar para ${relDay(D)}`, rows.filter(([,r]) => r[D]).map(([pid,r]) => row({t:esc(PR[pid].n), r:`<b style="color:var(--accent)">${fQty(roundStep(r[D] * 1.1, PR[pid].u), PR[pid].u)}</b>`})).join('') || '<div class="empty">Nada para esa entrega.</div>') +
    `<section class="grp"><h2 class="grp-h">Por día de entrega</h2><div class="tbl"><table><thead><tr><th>Producto</th>${dd.map(d => `<th>${fDow(d)} ${dateOf(d).getDate()}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(([pid,r]) => `<tr><td>${esc(PR[pid].n)}</td>${dd.map(d => `<td>${r[d] ? fQty(roundStep(r[d], PR[pid].u), PR[pid].u) : '—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="grp-f">Sale de cada cuánto te compra cada cliente y de los pedidos que ya tienes. No cuenta a los que llevan rato sin pedir.</p></section>`;
}

function renderSheet(){

  const sheet = root.querySelector('.sheet');

function openSheet(type, v, extra){ S.sheet = Object.assign({type, v}, extra || {}); S.err[type] = ''; if (type === 'sup-new') S.sheet.days = [1,2,3,4,5,6]; renderSheet(); }
function closeSheet(){ S.sheet = null; renderSheet(); }
function dragSheet(el){
  const top = el.querySelector('.sheet-top'); let y0 = null, t0 = 0, dy = 0;
  top.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; y0 = e.clientY; t0 = performance.now(); dy = 0; top.setPointerCapture(e.pointerId); el.style.transition = 'none'; });
  top.addEventListener('pointermove', e => { if (y0 == null) return; dy = e.clientY - y0; const v = dy < 0 ? dy / (1 + Math.abs(dy) / 40) * 0.3 : dy; el.style.transform = `translateY(${v}px)`; });
  const end = () => { if (y0 == null) return; const vel = dy / Math.max(1, performance.now() - t0); y0 = null; el.style.transition = ''; el.style.transform = '';
    if (dy > el.offsetHeight * 0.3 || vel > 0.5) closeSheet(); };

/* ---------- importación ---------- */
const UNITS = {kg:'kg',kilo:'kg',kilos:'kg',kgs:'kg',und:'und',unidad:'und',unidades:'und',un:'und',u:'und',atado:'atado',atados:'atado',manojo:'atado'};
function parsePrice(v){ if (typeof v === 'number') return Math.round(v); const s = String(v || '').replace(/[^\d.,]/g, ''); if (!s) return NaN; return Math.round(Number(s.replace(/[.,](?=\d{3}(\D|$))/g, '').replace(',', '.'))); }
function rowsFromText(txt){ const lines = txt.split(/\r?\n/).filter(l => l.trim()); if (!lines.length) return []; const sep = lines[0].includes('\t') ? '\t' : lines[0].split(';').length > lines[0].split(',').length ? ';' : ','; return lines.map(l => l.split(sep).map(c => c.trim().replace(/^"|"$/g, ''))); }
function analyze(rows){
  if (!rows.length) return {error:'No encontré filas. Revisa que el archivo tenga datos.'};
  const h = rows[0].map(norm), find = keys => h.findIndex(c => keys.some(k => c.includes(k)));
  let ci = {n: find(['producto','nombre','item','articulo']), c: find(['categoria','grupo','linea']), u: find(['unidad','medida','und']), p: find(['precio','valor','costo'])};
  let body = rows.slice(1);
  if (ci.n < 0 || ci.p < 0) { ci = {n:0, c:1, u:2, p:3}; body = rows; }
  const ok = [], bad = [], mine = productsOf(SID());
  body.forEach((r, i) => {
    const n = String(r[ci.n] ?? '').trim(), u0 = norm(r[ci.u] ?? ''), u = u0 ? UNITS[u0] : 'und', pr = parsePrice(r[ci.p]), line = i + (body === rows ? 1 : 2);
    if (!n || norm(n).startsWith('ejemplo')) return; if (isNaN(pr) || pr <= 0) { bad.push({line, n, why:'precio vacío o inválido'}); return; }
    if (!u) { bad.push({line, n, why:`unidad “${r[ci.u]}” no reconocida`}); return; }
    const ex = mine.find(p => norm(p.n) === norm(n));
    ok.push({n, c: String(ci.c >= 0 ? r[ci.c] ?? '' : '').trim() || 'Otros', u, pr, ex: ex ? ex.id : null, change: ex ? (ex.pr !== pr ? `${money(ex.pr)} → ${money(pr)}` : 'sin cambios') : 'nuevo'});
  });
  return {ok, bad};
}

    <div class="fgrid" style="margin-top:18px"><div class="field"><label for="imp-file">Subir plantilla llena</label><input class="inp" id="imp-file" type="file" accept=".xlsx,.xls,.csv,.txt"></div>

    ${I.err ? `<p class="err">${I.err}</p>` : ''}<button class="btn tint full" data-act="imp-paste">Revisar filas pegadas</button></div>`;
  const {ok, bad} = I.res, nNew = ok.filter(r => !r.ex).length, nUpd = ok.filter(r => r.ex && r.change !== 'sin cambios').length;
  return `${grp(`${nNew} nuevos · ${nUpd} precios cambian`, ok.map(r => row({t:esc(r.n), s:`${esc(r.c)} · ${r.u} · ${money(r.pr)}`, r:tag(!r.ex ? 'ok' : r.change === 'sin cambios' ? 'mute' : 'warn', esc(r.change))})).join(''), bad.length ? `No se importan: ${bad.map(b => `fila ${b.line} (${esc(b.n)}, ${esc(b.why)})`).join('; ')}.` : '')}
    <div class="fgrid" style="margin-top:16px"><button class="btn full" data-act="imp-apply" ${nNew + nUpd ? '' : 'disabled'}>Importar ${nNew + nUpd} cambios</button><button class="btn gray full" data-act="imp-reset">Volver</button></div>`;
}
function readImportFile(file){
  const name = file.name.toLowerCase(), done = res => { S.imp = res.error ? {err:res.error} : {res}; renderSheet(); };
  if (name.endsWith('.csv') || name.endsWith('.txt')) { file.text().then(t => done(analyze(rowsFromText(t)))); return; }
  if (typeof XLSX === 'undefined') { S.imp = {err:'No se pudo cargar el lector de Excel. Guarda como CSV o pega las filas.'}; renderSheet(); return; }
  file.arrayBuffer().then(buf => { try { const wb = XLSX.read(buf, {type:'array'}); done(analyze(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, blankrows:false}).map(r => r.map(c => c == null ? '' : c)))); }
    catch(e) { S.imp = {err:'No pude leer ese archivo. Prueba con .xlsx o .csv.'}; renderSheet(); } });
}

  else if (t.dataset.act === 'plan') { const b = biz(BID()), d = +t.dataset.d; if (t.value) b.log[d] = t.value; else delete b.log[d]; bizChanged(); toast(`${relDayC(d)}: ${t.value ? LEVELS[t.value].l.toLowerCase() : 'automático'}. Ajustamos inventario y pedidos.`); render(); }
  else if (t.id === 'imp-file' && t.files[0]) readImportFile(t.files[0]);
  else if (/^ai-(g|sg|out|sn)$/.test(t.dataset.act || '')) { const A = S.sheet.ai, it = A.items[+t.dataset.v], a = t.dataset.act;
    if (a === 'ai-sn') { if (t.value.trim()) it.name = t.value.trim(); renderSheet(); return; }
    const v = parseFloat(String(t.value).replace(',', '.')); if (v >= 0) { if (a === 'ai-g') it.g = v; if (a === 'ai-sg') it.inp[+t.dataset.d].g = v; if (a === 'ai-out') it.out = v; } renderSheet(); }
  else if (t.id === 'ai-new') S.sheet.ai.isNew = t.checked;
  else if (t.dataset.act === 'dcat') { biz(BID()).menu.find(x => x.id === t.dataset.v).cat = t.value; S.kitCat = t.value; toast(`Movido a ${t.value}`); render(); }
  else if (['cg','sg','sout','dprice','yap','ycoc'].includes(t.dataset.act)) { const v = parseFloat(String(t.value).replace(',', '.')), a = t.dataset.act, bid = BID();
    if (!(v >= 0)) { render(); return; }
    if (a === 'cg') biz(bid).menu.find(x => x.id === t.dataset.v).comp[+t.dataset.d].g = v;
    if (a === 'dprice' && v > 0) biz(bid).menu.find(x => x.id === t.dataset.v).price = v;
    if (a === 'sg') subOf(bid, t.dataset.v).inp[+t.dataset.d].g = v;
    if (a === 'sout') subOf(bid, t.dataset.v).out = v;
    if ((a === 'yap' || a === 'ycoc') && v > 0 && v <= 100) { const y = biz(bid).yields[t.dataset.v] ||= {}; y[a === 'yap' ? 'ap' : 'coc'] = v / 100; y.ok = true; taskDone(); }
    bizChanged(); render(); }
});
document.addEventListener('input', e => { const t = e.target; if (S.sheet && S.sheet.type === 'ai' && /^ai-(name|desc|price|per|catx)$/.test(t.id)) { S.sheet.ai[t.id.slice(3)] = t.value; if ($('ai-stats')) $('ai-stats').innerHTML = aiStats(); if (t.id === 'ai-catx') S.sheet.ai.cat = ''; }
  if (/^yl-/.test(e.target.id) && $('yres')) $('yres').innerHTML = yieldRes(); if (e.target.id === 'search') { S.q = e.target.value; $('catalog').innerHTML = catalogRows(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });
render();
</script>
